name: Lemon Squeezy compatibility difference
description: A Keypost response, error message, event or behavior differs from the real Lemon Squeezy API.
title: "[Compat] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keypost aims to match the Lemon Squeezy License API, JSON:API and outgoing webhooks exactly. Differences are bugs, and the most useful report shows **both** responses side by side. See [API compatibility](https://github.com/GanymedeNil/Keypost/blob/main/docs/API_COMPATIBILITY.md) for what has already been compared.

        **Never paste secrets.** Mask API keys, license keys, webhook secrets and customer data in everything below.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - License API (activate / validate / deactivate)
        - JSON:API resource (orders, customers, subscriptions, license keys, …)
        - Outgoing webhook (event name or payload)
        - Webhook signature
        - Pagination, filtering or includes
        - Error messages or status codes
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Method, path, query and body (secrets masked).
      render: http
    validations:
      required: true
  - type: textarea
    id: lemon-squeezy
    attributes:
      label: Lemon Squeezy response
      description: Status and body from the real Lemon Squeezy API (test mode is fine), with identifiers masked consistently.
      render: json
    validations:
      required: true
  - type: textarea
    id: keypost
    attributes:
      label: Keypost response
      description: Status and body from Keypost for the same request.
      render: json
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: What breaks for your client?
      description: Optional, but it helps to prioritize (an SDK, a license check in your app, a webhook consumer, …).
  - type: input
    id: version
    attributes:
      label: Keypost version
      description: Output of `dfctl version`.
      placeholder: "0.1.0 (a1b2c3d)"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and checked docs/API_COMPATIBILITY.md.
          required: true
        - label: I removed secrets, license keys and customer data from everything I pasted.
          required: true
